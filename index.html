<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻占卦</title>
    <style>
        /* ══════════════════════════════════════════════════
           基础样式与主题（完美适配手机端）
           ══════════════════════════════════════════════════ */
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0a08;
            background-image: linear-gradient(180deg, #0c0a08 0%, #1a1510 40%, #0e0c08 100%);
            color: #e8e0d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 衬线体用于传统文化标题 */
        .traditional-font {
            font-family: "Noto Serif SC", "Source Han Serif CN", "Georgia", "SimSun", "Songti SC", serif;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
            padding: 32px 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .subtitle {
            font-size: 12px;
            letter-spacing: 10px;
            color: #8a7f72;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 38px;
            font-weight: 900;
            color: #c9a84c;
            margin: 8px 0;
            letter-spacing: 10px;
        }
        .header .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a84c, transparent);
            margin: 0 auto;
        }

        /* 通用卡片 */
        .card {
            background: rgba(26, 23, 20, 0.82);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 24px;
            box-sizing: border-box;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }

        /* 输入框 */
        textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(201, 168, 76, 0.15);
            border-radius: 10px;
            padding: 14px 16px;
            color: #e8e0d4;
            font-size: 15px;
            resize: none;
            height: 72px;
            outline: none;
            line-height: 1.6;
            margin-top: 12px;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: rgba(201, 168, 76, 0.5);
        }

        /* 按钮主样式 */
        .btn-main {
            display: block;
            width: 80%;
            margin: 30px auto 0 auto;
            font-size: 18px;
            color: #0a0908;
            background: linear-gradient(135deg, #e8c95a, #c9a84c, #b8942a);
            border: none;
            border-radius: 50px;
            padding: 15px 0;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 6px;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.25);
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn-main:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-sub {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(201, 168, 76, 0.4);
            color: #c9a84c;
            padding: 11px 32px;
            border-radius: 50px;
            font-size: 14px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin-top: 15px;
        }
        .btn-sub:active {
            background: rgba(201, 168, 76, 0.1);
        }

        /* 进度条样式 */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .progress-dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: rgba(201, 168, 76, 0.12);
            transition: background 0.3s;
        }
        .progress-dot.active {
            background: rgba(201, 168, 76, 0.6);
        }
        .progress-dot.done {
            background: #c9a84c;
        }

        /* 铜钱放置区域 */
        .coin-plate {
            background: radial-gradient(ellipse at center, rgba(55, 42, 18, 0.25), rgba(18, 14, 8, 0.45));
            border: 1px solid rgba(201, 168, 76, 0.08);
            border-radius: 16px;
            padding: 24px 10px;
            margin: 16px 0;
            min-height: 110px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin-container {
            position: relative;
            width: 260px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin-wrapper {
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 动画震动效果 */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 5px) rotate(-10deg); }
            40% { transform: translate(6px, -6px) rotate(15deg); }
            60% { transform: translate(-5px, 3px) rotate(-8deg); }
            80% { transform: translate(4px, -4px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking {
            animation: shake 0.4s ease-in-out infinite;
        }

        /* 阴阳爻画线 */
        .hex-line-box {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 7px;
            margin: 16px 0;
            padding: 14px;
            background: rgba(26, 23, 20, 0.4);
            border-radius: 12px;
        }
        .hex-line-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 10px;
            width: 120px;
        }
        .line-yang {
            width: 120px;
            height: 9px;
            border-radius: 2px;
        }
        .line-yin-segment {
            width: 53px;
            height: 9px;
            border-radius: 2px;
        }

        /* 爻辞列表单项 */
        .yao-item {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid transparent;
            line-height: 1.6;
        }
        .yao-item.changing {
            background: rgba(212, 92, 92, 0.06);
            border-left-color: #d45c5c;
        }
        .yao-title {
            font-size: 13px;
            font-weight: 700;
            margin-right: 8px;
        }
        .yao-text {
            color: #9a9080;
            font-size: 13.5px;
        }

        /* 背景微尘效果 */
        .bg-particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <svg style="display:none;">
        <defs>
            <radialGradient id="bg-char" cx="40%" cy="36%">
                <stop offset="0%" stop-color="#c4a24e"/>
                <stop offset="30%" stop-color="#a8843a"/>
                <stop offset="70%" stop-color="#7c5e22"/>
                <stop offset="100%" stop-color="#5a4214"/>
            </radialGradient>
            <radialGradient id="bg-back" cx="40%" cy="36%">
                <stop offset="0%" stop-color="#b89840"/>
                <stop offset="30%" stop-color="#9c7a32"/>
                <stop offset="70%" stop-color="#72561c"/>
                <stop offset="100%" stop-color="#503c10"/>
            </radialGradient>
            <radialGradient id="hi-coin" cx="35%" cy="30%">
                <stop offset="0%" stop-color="rgba(255,240,180,0.18)"/>
                <stop offset="100%" stop-color="rgba(255,240,180,0)"/>
            </radialGradient>
            <filter id="ds-coin">
                <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
            </filter>
        </defs>
    </svg>

    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="subtitle">周易 · 传统铜钱占法</div>
            <h1 class="traditional-font">六爻占卦</h1>
            <div class="divider"></div>
        </div>

        <div id="phase-welcome">
            <div class="card" style="text-align: center;">
                <div class="traditional-font" style="font-size: 19px; color: #e8d48b; letter-spacing: 1px;">施主请静心</div>
                <div style="font-size: 13.5px; color: #8a7f72; margin-top: 8px; line-height: 1.8;">
                    占卦之前，请先在心中默念或写下您想问的事情。<br>一事一占，心诚则灵。
                </div>
                <textarea id="question-input" placeholder="在此写下您心中求占之事（选填）"></textarea>
                <div style="font-size: 13px; color: #6a5f52; line-height: 1.8; margin-top: 20px;">
                    准备好后，点击下方按钮开始掷铜钱<br>共需起卦六次，自下而上凝聚卦象
                </div>
            </div>
            <button class="btn-main traditional-font" onclick="startTossing()">开始启卦</button>
        </div>

        <div id="phase-tossing" class="hidden">
            <div class="progress-bar" id="toss-progress">
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
            </div>

            <div style="text-align: center; margin: 16px 0;">
                <div class="traditional-font" id="current-yao-title" style="font-size: 19px; color: #e8d48b; letter-spacing: 1px;">第 一 爻</div>
                <div id="toss-tip" style="font-size: 13px; color: #8a7f72; margin-top: 4px;">意念集中，点击下方按钮掷出铜钱</div>
            </div>

            <div class="coin-plate">
                <div class="coin-container" id="coin-stage">
                    </div>
            </div>

            <div id="toss-result-card" class="card hidden" style="padding: 16px 20px; margin: 16px 0;">
                </div>

            <div class="hex-line-box" id="live-hex-preview" style="display:none;">
                <div style="font-size: 11px; color: #6a5f52; margin-top: 4px; width:100%; text-align:center;">已成初生卦象</div>
            </div>

            <div style="text-align: center; margin-top: 24px;">
                <button class="btn-main" id="btn-action" onclick="handleTossAction()">掷 铜 钱</button>
            </div>
        </div>

        <div id="phase-reading" class="hidden">
            <div class="card" style="padding: 22px 24px; margin-bottom: 20px;">
                <div style="display: flex; gap: 26px; align-items: center;">
                    <div class="hex-line-box" id="final-hex-visual" style="background:transparent; padding:0; margin:0; gap:5px;">
                        </div>
                    <div>
                        <div class="traditional-font" id="read-hex-name" style="font-size: 34px; font-weight: 900; color: #c9a84c;"></div>
                        <div class="traditional-font" id="read-hex-title" style="font-size: 15px; color: #e8d48b; margin-top: 2px;"></div>
                        <div id="read-biangua-title" style="font-size: 13px; color: #d45c5c; marginTop: 6px; font-family:serif; font-weight:bold;" class="hidden"></div>
                    </div>
                </div>
                <div id="read-question-row" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(201, 168, 76, 0.1); font-size: 13.5px; color: #8a7f72;" class="hidden">
                    所求之事：<span id="read-question-text" style="color: #b0a898;"></span>
                </div>
            </div>

            <div class="card" style="padding: 26px 22px;">
                <div class="traditional-font" style="font-size: 15px; color: #c9a84c; margin-bottom: 18px; letter-spacing: 3px; display: flex; align-items: center; gap: 8px;">
                    <span>📜</span> 经典原卦辞
                </div>

                <div style="margin-bottom: 26px;">
                    <div class="traditional-font" id="text-gua-title" style="font-size: 14.5px; color: #c9a84c; margin-bottom: 10px; font-weight: 700; border-left: 3px solid #c9a84c; padding-left: 10px;"></div>
                    <div id="text-gua-content" style="padding-left: 13px; color: #c8c0b4; font-size: 14.5px; line-height: 1.8; white-space: pre-wrap;"></div>
                </div>

                <div style="margin-bottom: 6px;">
                    <div class="traditional-font" style="font-size: 14.5px; color: #c9a84c; margin-bottom: 12px; font-weight: 700; border-left: 3px solid #c9a84c; padding-left: 10px;">六爻原本爻辞</div>
                    <div id="text-yaoci-list" style="display: flex; flex-direction: column;">
                        </div>
                </div>

                <div id="text-biangua-block" style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(201, 168, 76, 0.1);" class="hidden">
                    <div class="traditional-font" id="text-biangua-title" style="font-size: 14.5px; color: #d45c5c; margin-bottom: 8px; font-weight: 700;"></div>
                    <div id="text-biangua-content" style="padding-left: 13px; font-size: 13.5px; color: #9a9080; line-height: 1.8;"></div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 24px; margin-bottom: 40px;">
                <button class="btn-sub traditional-font" onclick="resetApp()">重新起卦</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 32px; font-size: 11px; color: #4a4238; line-height: 1.8;">
            心诚则灵 · 同一事不可反复占问
        </div>
    </div>

    <script>
        // 1. 周易核心基础数据
        const HEX_LOOKUP = [
            [2,24,7,45,15,36,46,11],
            [16,51,3,17,27,21,42,34],
            [8,40,29,47,4,64,59,6],
            [19,54,60,58,41,38,61,10],
            [23,62,39,31,52,56,53,33],
            [35,55,63,49,22,30,37,13],
            [20,32,48,28,18,50,57,44],
            [12,25,5,43,26,14,9,1]
        ];

        const HEXAGRAMS = {
            1:{name:'乾',title:'乾为天',gua:'元亨，利贞。',yao:['潜龙勿用。','见龙在田，利见大人。','君子终日乾乾，夕惕若厉，无咎。','或跃在渊，无咎。','飞龙在天，利见大人。','亢龙有悔。']},2:{name:'坤',title:'坤为地',gua:'元亨，利牝马之贞。',yao:['履霜，坚冰至。','直方大，不习无不利。','含章可贞。或从王事，无成有终。','括囊，无咎无誉。','黄裳，元吉。','龙战于野，其血玄黄。']},3:{name:'屯',title:'水雷屯',gua:'元亨，利贞。勿用有攸往，利建侯。',yao:['磐桓，利居贞，利建侯。','屯如邅如，乘马班如。匪寇，婚媾。','即鹿无虞，惟入于林中。君子几不如舍，往吝。','乘马班如，求婚媾。往吉，无不利。','屯其膏，小贞吉，大贞凶。','乘马班如，泣血涟如。']},4:{name:'蒙',title:'山水蒙',gua:'亨。匪我求童蒙，童蒙求我。',yao:['发蒙，利用刑人，用说桎梏，以往吝。','包蒙，吉。纳妇，吉。子克家。','勿用取女，见金夫，不有躬。无攸利。','困蒙，吝。','童蒙，吉。','击蒙，不利为寇，利御寇。']},5:{name:'需',title:'水天需',gua:'有孚，光亨，贞吉。利涉大川。',yao:['需于郊，利用恒，无咎。','需于沙，小有言，终吉。','需于泥，致寇至。','需于血，出自穴。','需于酒食，贞吉。','入于穴，有不速之客三人来，敬之终吉。']},6:{name:'讼',title:'天水讼',gua:'有孚窒惕，中吉，终凶。',yao:['不永所事，小有言，终吉。','不克讼，归而逋。其邑人三百户，无眚。','食旧德，贞厉，终吉。或从王事，无成。','不克讼，复即命渝，安贞吉。','讼，元吉。','或锡之鞶带，终朝三褫之。']},7:{name:'师',title:'地水师',gua:'贞，丈人吉，无咎。',yao:['师出以律，否臧凶。','在师中，吉，无咎.王三锡命。','师或舆尸，凶。','师左次，无咎.','田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。','大君有命，开国承家，小人勿用。']},8:{name:'比',title:'地水比',gua:'吉。原筮，元永贞，无咎。',yao:['开孚比之，无咎。有孚盈缶，终来有它吉。','比之自内，贞吉。','比之匪人。','外比之，贞吉.','显比，王用三驱，失前禽，邑人不诫，吉。','比之无首，凶。']},9:{name:'小畜',title:'风天小畜',gua:'亨。密云不雨，自我西郊。',yao:['复自道，何其咎，吉。','牵复，吉。','舆说辐，夫妻反目。','有孚，血去惕出，无咎.','有孚挛如，富以其邻。','既雨既处，尚德载。妇贞厉。']},10:{name:'履',title:'天泽履',gua:'履虎尾，不咥人。亨。',yao:['素履往，无咎。','履道坦坦，幽人贞吉。','眇能视，跛能履。履虎尾，咥人凶。武人为于大君。','履虎尾，愬愬，终吉。','嬖履，贞厉。','视履考祥，其旋元吉。']},
            11:{name:'泰',title:'地天泰',gua:'小往大来，吉，亨。',yao:['拔茅茹以其汇，征吉。','包荒，用冯河，不遐遗。朋亡，得尚于中行。','无平不陂，无往不复。艰贞无咎。','翩翩，不富以其邻，不戒以孚。','帝乙归妹，以祉元吉。','城复于隍，勿用师，自邑告命。贞吝。']},12:{name:'否',title:'天地否',gua:'否之匪人，不利君子贞。大往小来。',yao:['拔茅茹以其汇，贞吉，亨。','包承，小人吉，大人否亨。','包羞。','有命无咎，畴离祉。','休否，大人吉。其亡其亡，系于苞桑。','倾否，先否后喜。']},13:{name:'同人',title:'天火同人',gua:'同人于野，亨。利涉大川。',yao:['同人于门，无咎。','同人于宗，吝。','伏戎于莽，升其高陵，三岁不兴。','乘其墉，弗克攻，吉。','同人先号咷而后笑，大师克相遇。','同人于郊，无悔。']},14:{name:'大有',title:'火天大有',gua:'元亨。',yao:['无交害，匪咎。艰则无咎。','大车以载，有攸往，无咎.','公用亨于天子，小人弗克。','匪其彭，无咎。','厥孚交如，威如，吉。','自天祐之，吉，无不利。']},15:{name:'谦',title:'地山谦',gua:'亨，君子有终。',yao:['谦谦君子，用涉大川，吉。','鸣谦，贞吉。','劳谦，君子有终，吉。','无不利，撝谦。','不富以其邻，利用侵伐，无不利。','鸣谦，利用行师征邑国。']},16:{name:'豫',title:'雷地豫',gua:'利建侯行师。',yao:['鸣豫，凶。','介于石，不终日，贞吉。','盱豫，悔，迟有悔。','由豫，大有得，勿疑。朋盍簪。','贞疾，恒不死。','冥豫，成有渝，无咎。']},17:{name:'随',title:'泽雷随',gua:'元亨，利贞，无咎。',yao:['官有渝，贞吉。出门交有功。','系小子，失丈夫。','系丈夫，失小子。随有求得，利居贞。','随有获，贞凶。有孚在道，以明，何咎。','孚于嘉，吉。','拘系之，乃从维之。王用亨于西山。']},18:{name:'蛊',title:'山风蛊',gua:'元亨，利涉大川。',yao:['干父之蛊，有子，考无咎，厉终吉。','干母之蛊，不可贞。','干父之蛊，小有悔，无大咎。','裕父之蛊，往见吝。','干父之蛊，用誉。','不事王侯，高尚其事。']},19:{name:'临',title:'地泽临',gua:'元亨，利贞。至于八月有凶。',yao:['咸临，贞吉。','咸临，吉，无不利。','甘临，无攸利。既忧之，无咎。','至临，无咎.','知临，大君之宜，吉。','敦临，吉，无咎。']},20:{name:'观',title:'风地观',gua:'盥而不荐，有孚颙若。',yao:['童观，小人无咎，君子吝。','窥观，利女贞。','观我生，进退。','观国之光，利用宾于王。','观我生，君子无咎。','观其生，君子无咎。']},
            21:{name:'噬嗑',title:'火雷噬嗑',gua:'亨，利用狱。',yao:['屦校灭趾，无咎。','噬肤灭鼻，无咎。','噬腊肉，遇毒。小吝，无咎。','噬干胏，得金矢。利艰贞，吉。','噬干肉，得黄金。贞厉，无咎。','何校灭耳，凶。']},22:{name:'贲',title:'山火贲',gua:'亨，小利有攸往。',yao:['贲其趾，舍车而徒。','贲其须。','贲如濡如，永贞吉。','贲如皤如，白马翰如。匪寇，婚媾。','贲于丘园，束帛戋戋。吝，终吉。','白贲，无咎。']},23:{name:'剥',title:'山地剥',gua:'不利有攸往。',yao:['剥床以足，蔑贞凶。','剥床以辨，蔑贞凶。','剥之，无咎。','剥床以肤，凶。','贯鱼，以宫人宠，无不利。','硕果不食，君子得舆，小人剥庐。']},24:{name:'复',title:'地雷复',gua:'亨。出入无疾，朋来无咎。反复其道，七日来复。',yao:['不远复，无祗悔，元吉。','休复，吉。','频复，厉，无咎。','中行独复。','敦复，无悔。','迷复，凶，有灾眚。']},25:{name:'无妄',title:'天雷无妄',gua:'元亨，利贞。其匪正有眚，不利有攸往。',yao:['无妄往，吉。','不耕获，不菑畬，则利有攸往。','无妄之灾，或系之牛。行人之得，邑人之灾。','可贞，无咎.','无妄之疾，勿药有喜。','无妄行，有眚，无攸利。']},26:{name:'大畜',title:'山天大畜',gua:'利贞。不家食吉，利涉大川。',yao:['有厉，利已。','舆说辐。','良马逐，利艰贞。日闲舆卫，利有攸往。','童牛之牿，元吉。','豮豕之牙，吉。','何天之衢，亨。']},27:{name:'颐',title:'山雷颐',gua:'贞吉。观颐，自求口实。',yao:['舍尔灵龟，观我朵颐，凶。','颠颐，拂经于丘颐，征凶.','拂颐，贞凶。十年勿用，无攸利。','颠颐，吉。虎视眈眈，其欲逐逐，无咎。','拂经，居贞吉。不可涉大川。','由颐，厉吉。利涉大川。']},28:{name:'大过',title:'泽风大过',gua:'栋桡，利有攸往，亨。',yao:['藉用白茅，无咎。','枯杨生稊，老夫得其女妻，无不利。','栋桡，凶。','栋隆，吉。有它吝。','枯杨生华，老妇得其士夫。无咎无誉。','过涉灭顶，凶，无咎。']},29:{name:'坎',title:'坎为水',gua:'习坎，有孚，维心亨，行有尚。',yao:['习坎，入于坎窞，凶。','坎有险，求小得。','来之坎坎，险且枕，入于坎窞，勿用。','樽酒簋贰，用缶，纳约自牖，终无咎。','坎不盈，祗既平，无咎。','系用徽纆，寘于丛棘，三岁不得，凶。']},30:{name:'离',title:'离为火',gua:'利贞，亨。畜牝牛，吉。',yao:['履错然，敬之无咎。','黄离，元吉行业。','日昃之离，不鼓缶而歌，则大耋之嗟，凶。','突如其来如，焚如，死如，弃如。','出涕沱若，戚嗟若，吉。','王用出征，有嘉折首，获匪其丑，无咎。']},
            31:{name:'咸',title:'泽山咸',gua:'亨，利贞。取女吉。',yao:['咸其拇。','咸其腓，凶。居吉。','咸其股，执其随，往吝。','贞吉悔亡。憧憧往来，朋从尔思。','咸其脢，无悔。','咸其辅颊舌。']},32:{name:'恒',title:'雷风恒',gua:'亨，无咎，利贞。利有攸往。',yao:['浚恒，贞凶。无攸利。','悔亡。','不恒其德，或承之羞，贞吝。','田无禽。','恒其德，贞，妇人吉，夫子凶。','振恒，凶。']},33:{name:'遁',title:'天山遁',gua:'亨，小利贞。',yao:['遁尾，厉，勿用有攸往。','执之用黄牛之革，莫之胜说。','系遁，有疾厉。畜臣妾吉。','好遁，君子吉，小人否。','嘉遁，贞吉。','肥遁，无不利。']},34:{name:'大壮',title:'雷天大壮',gua:'利贞。',yao:['壮于趾，征凶，有孚。','贞吉。','小人用壮，君子用罔。贞厉。','贞吉悔亡，藩决不羸。壮于大舆之輹。','丧羊于易，无悔。','羝羊触藩，不能退，不能遂。无攸利，艰则吉。']},35:{name:'晋',title:'火地晋',gua:'康侯用锡马蕃庶，昼日三接。',yao:['晋如摧如，贞吉。罔孚裕，无咎。','晋如愁如，贞吉.受兹介福，于其王母。','众允，悔亡。','晋如鼫鼠，贞厉。','悔亡，失得勿恤。往吉，无不利。','晋其角，维用伐邑。厉吉无咎，贞吝。']},36:{name:'明夷',title:'地火明夷',gua:'利艰贞。',yao:['明夷于飞，垂其翼。君子于行，三日不食。','明夷，夷于左股，用拯马壮，吉。','明夷于南狩，得其大首。不可疾贞。','入于左腹，获明夷之心，于出门庭。','箕子之明夷，利贞.','不明晦，初登于天，后入于地。']},37:{name:'家人',title:'风火家人',gua:'利女贞。',yao:['闲有家，悔亡.','无攸遂，在中馈，贞吉。','家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。','富家，大吉。','王假有家，勿恤，吉。','有孚威如，终吉。']},38:{name:'睽',title:'火泽睽',gua:'小事吉。',yao:['悔亡，丧马勿逐，自复。见恶人，无咎。','遇主于巷，无咎。','见舆曳，其牛掣，其人天且劓。无初有终。','睽孤，遇元夫，交孚。厉无咎。','悔亡，厥宗噬肤。往何咎。','睽孤，见豕负涂，载鬼一车。先张之弧，后说之弧。匪寇婚媾，往遇雨则吉。']},39:{name:'蹇',title:'水山蹇',gua:'利西南，不利东北。利见大人，贞吉。',yao:['往蹇来誉。','王臣蹇蹇，匪躬之故。','往蹇来反。','往蹇来连。','大蹇朋来。','往蹇来硕，吉。利见大人。']},40:{name:'解',title:'雷水解',gua:'利西南。无所往，其来复吉。有攸往，夙吉。',yao:['无咎。','田获三狐，得黄矢。贞吉。','负且乘，致寇至，贞吝。','解而拇，朋至斯孚。','君子维有解，吉。有孚于小人。','公用射隼于高墉之上，获之，无不利。']},
            41:{name:'损',title:'山泽损',gua:'有孚，元吉，无咎，可贞。利有攸往。',yao:['已事遄往，无咎，酌损之。','利贞，征凶。弗损益之。','三人行则损一人，一人行则得其友。','损其疾，使遄有喜，无咎。','或益之十朋之龟，弗克违。元吉。','弗损益之，无咎。贞吉。利有攸往，得臣无家。']},42:{name:'益',title:'风雷益',gua:'利有攸往，利涉大川。',yao:['利用为大作，元吉，无咎。','或益之十朋之龟，弗克违。永贞吉。','益之用凶事，无咎。有孚中行，告公用圭。','中行告公从，利用为依迁国。','有孚惠心，勿问元吉。有孚惠我德。','莫益之，或击之。立心勿恒，凶。']},43:{name:'夬',title:'泽天夬',gua:'扬于王庭，孚号有厉。告自邑，不利即戎。',yao:['壮于前趾，往不胜为咎。','惕号，莫夜有戎，勿恤。','壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。','臀无肤，其行次且。牵羊悔亡，闻言不信。','苋陆夬夬，中行无咎。','无号，终有凶。']},44:{name:'姤',title:'天风姤',gua:'女壮，勿用取女。',yao:['系于金柅，贞吉。有攸往，见凶。','包有鱼，无咎，不利宾。','臀无肤，其行次且。厉，无大咎。','包无鱼，起凶。','以杞包瓜，含章，有陨自天。','姤其角，吝，无咎。']},45:{name:'萃',title:'泽地萃',gua:'亨。王假有庙。利见大人，亨，利贞。',yao:['有孚不终，乃乱乃萃。若号，一握为笑。勿恤，往无咎。','引吉，无咎。孚乃利用禴。','萃如嗟如，无攸利。往无咎，小吝。','大吉，无咎。','萃有位，无咎。匪孚，元永贞，悔亡。','赍咨涕洟，无咎。']},46:{name:'升',title:'地风升',gua:'元亨，用见大人，勿恤。南征吉。',yao:['允升，大吉。','孚乃利用禴，无咎。','升虚邑。','王用亨于岐山，吉，无咎。','贞吉，升阶。','冥升，利于不息之贞。']},47:{name:'困',title:'泽水困',gua:'亨，贞，大人吉，无咎。有言不信。',yao:['臀困于株木，入于幽谷，三岁不觌。','困于酒食，朱绂方来。利用享祀，征凶，无咎。','困于石，据于蒺藜。入于其宫，不见其妻，凶。','来徐徐，困于金车。吝，有终。','哶刖，困于赤绂。乃徐有说，利用祭祀。','困于葛藟，于臲卼。曰动悔有悔，征吉。']},48:{name:'井',title:'水风井',gua:'改邑不改井，无丧无得。往来井井。',yao:['井泥不食，旧井无禽。','井谷射鲋，瓮敝漏。','井渫不食，为我心恻。可用汲，王明，并受其福。','井甃，无咎。','井冽寒泉，食。','井收勿幕，有孚元吉。']},49:{name:'革',title:'泽火革',gua:'巳日乃孚。元亨利贞，悔亡。',yao:['巩用黄牛之革。','巳日乃革之。征吉，无咎。','征凶，贞厉。革言三就，有孚。','悔亡，有孚改命，吉。','大人虎变，未占有孚。','君子豹变，小人革面。征凶，居贞吉。']},50:{name:'鼎',title:'火风鼎',gua:'元吉，亨。',yao:['鼎颠趾，利出否。得妾以其子，无咎.','鼎有实，我仇有疾，不我能即，吉。','鼎耳革，其行塞。雉膏不食，方雨亏悔，终吉。','鼎折足，覆公餗，其形渥，凶。','鼎黄耳金铉，利贞。','鼎玉铉，大吉，无不利。']},
            51:{name:'震',title:'震为雷',gua:'亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。',yao:['震来虩虩，后笑言哑哑，吉。','震来厉。亿丧贝，跻于九陵，勿逐，七日得。','震苏苏，震行无眚。','震遂泥。','震往来厉，亿无丧，有事。','震索索，视矍矍，征凶。']},52:{name:'艮',title:'艮为山',gua:'艮其背，不获其身。行其庭，不见其人。无咎。',yao:['艮其趾，无咎。利永贞。','艮其腓，不拯救其随，其心不快。','艮其限，列其夤，厉薰心。','艮其身，无咎.','艮其辅，言有序，悔亡.','敦艮，吉。']},53:{name:'渐',title:'风山渐',gua:'女归吉，利贞。',yao:['鸿渐于干，小子厉，有言，无咎.','鸿渐于磐，饮食衎衎，吉。','鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。','鸿渐于木，或得其桷，无咎。','鸿渐于陵，妇三岁不孕，终莫之胜，吉。','鸿渐于陆，其羽可用为仪，吉。']},54:{name:'归妹',title:'雷泽归妹',gua:'征凶，无攸利。',yao:['归妹以娣，跛能履，征吉。','眇能视，利幽人之贞。','归妹以须，反归以娣。','归妹愆期，迟归有时。','帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。','女承筐无实，士刲羊无血，无攸利。']},55:{name:'丰',title:'雷火丰',gua:'亨，王假之。勿忧，宜日中。',yao:['遇其配主，虽旬无咎，往有尚。','丰其蔀，日中见斗。往得疑疾，有孚发若，吉。','丰其沛，日中见沬。折其右肱，无咎。','丰其蔀，日中见斗。遇其夷主，吉。','来章，有庆誉，吉。','丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。']},56:{name:'旅',title:'火山旅',gua:'小亨，旅贞吉。',yao:['旅琐琐，斯其所取灾。','旅即次，怀其资，得童仆贞。','旅焚其次，丧其童仆，贞厉。','旅于处，得其资斧，我心不快。','射雉一矢亡，终以誉命。','鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。']},57:{name:'巽',title:'巽为风',gua:'小亨，利有攸往，利见大人。',yao:['进退，利武人之贞。','巽在床下，用史巫纷若，吉，无咎.','频巽，吝。','悔亡，田获三品。','贞吉悔亡，无不利。无初有终。','巽在床下，丧其资斧。贞凶。']},58:{name:'兑',title:'兑为泽',gua:'亨，利贞。',yao:['和兑，吉。','孚兑，吉，悔亡。','来兑，凶。','商兑未宁，介疾有喜。','孚于剥，有厉。','引兑。']},59:{name:'涣',title:'风水涣',gua:'亨。王假有庙，利涉大川，利贞。',yao:['用拯救马壮，吉。','涣奔其机，悔亡。','涣其躬，无悔.','涣其群，元吉。涣有丘，匪夷所思。','涣汗其大号，涣王居，无咎。','涣其血去逖出，无咎。']},60:{name:'节',title:'水泽节',gua:'亨。苦节不可贞。',yao:['不出户庭，无咎。','不出门庭，凶。','不节若，则嗟若，无咎。','安节，亨。','甘节，吉。往有尚。','苦节，贞凶，悔亡。']},
            61:{name:'中孚',title:'风泽中孚',gua:'豚鱼吉，利涉大川，利贞。',yao:['浅吉，有它不燕。','鹤鸣在阴，其子和之。我有好爵，吾与尔靡之。','得敌，或鼓或罢，或泣或歌。','月几望，马匹亡，无咎。','有孚挛如，无咎。','翰音登于天，贞凶。']},62:{name:'小过',title:'雷山小过',gua:'亨，利贞。可小事，不可大事。',yao:['飞鸟以凶。','过其祖，遇其妣。不不不及其君，遇其臣，无咎。','弗过防之，从或戕之，凶。','无咎，弗过遇之。往厉必戒，勿用永贞。','密云不雨，自我西郊。公弋取彼在穴。','弗遇过之，飞鸟离之，凶。是谓灾眚。']},63:{name:'既济',title:'水火既济',gua:'亨小，利贞。初吉终乱。',yao:['曳其轮，濡其尾，无咎。','妇丧其，勿逐，七日得。','高宗伐鬼方，三年克之。小人勿用。','繻有衣袽，终日戒。','东邻杀牛，不如西邻之禴祭，实受其福。','濡其首，厉。']},64:{name:'未济',title:'火水未济',gua:'亨。小狐汔济，濡其尾，无攸利。',yao:['濡其尾，吝。','曳其轮，贞吉。','未济，征凶，利涉大川。','贞吉悔亡，震用伐鬼方，三年有赏于大国。','贞吉，无悔。君子之光，有孚，吉。','有孚于饮酒，无咎。濡其首，有孚失是。']}
        };

        const YAO_INDEX_NAMES = ['一', '二', '三', '四', '五', '六'];
        const YAO_POSITION_NAMES = ['初', '二', '三', '四', '五', '上'];
        const COIN_LAYOUTS = [
            { x: -65, y: 4, r: -12 },
            { x: 0, y: -4, r: 3 },
            { x: 65, y: 4, r: 10 }
        ];

        // 2. 状态变量
        let appState = {
            question: '',
            currentTossIndex: 0,
            tosses: [], // 记录每一次的掷币结果
            isAnimating: false,
            hasTossedCurrentRound: false
        };

        // 3. 初始渲染背景微尘
        function initBackground() {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.left = (Math.random() * 80 + 10) + '%';
                p.style.top = (Math.random() * 90) + '%';
                p.style.width = '2px';
                p.style.height = '2px';
                p.style.background = 'rgba(201,168,76,0.15)';
                p.style.borderRadius = '50%';
                container.appendChild(p);
            }
        }
        initBackground();

        // 4. 铜钱离线 SVG 生成器
        function createCoinSvgHtml(isCharSide) {
            const bgGlow = isCharSide ? 'url(#bg-char)' : 'url(#bg-back)';
            const content = isCharSide ? `
                <text x="60" y="41" text-anchor="middle" font-size="17" font-weight="800" font-family="serif" fill="#3a2a0a" opacity="0.85">崇</text>
                <text x="60" y="91" text-anchor="middle" font-size="17" font-weight="800" font-family="serif" fill="#3a2a0a" opacity="0.85">寶</text>
                <text x="86" y="66" text-anchor="middle" font-size="17" font-weight="800" font-family="serif" fill="#3a2a0a" opacity="0.85">通</text>
                <text x="34" y="66" text-anchor="middle" font-size="17" font-weight="800" font-family="serif" fill="#3a2a0a" opacity="0.85">宁</text>
                <circle cx="28" cy="34" r="3.5" fill="rgba(68,92,58,0.1)"/>
                <circle cx="85" cy="82" r="5" fill="rgba(58,82,52,0.08)"/>
            ` : `
                <path d="M 60 26 Q 68 32 60 38 Q 55 32 60 26" fill="none" stroke="#5a4820" stroke-width="1.3" opacity="0.4"/>
                <circle cx="72" cy="86" r="1.8" fill="#5a4820" opacity="0.25"/>
            `;
            return `
            <svg width="72" height="72" viewBox="0 0 120 120" style="display:block;">
                <circle cx="60" cy="60" r="56" fill="${bgGlow}" filter="url(#ds-coin)"/>
                <circle cx="60" cy="60" r="56" fill="none" stroke="#8a6e28" stroke-width="2.5"/>
                <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(120,90,30,0.2)" stroke-width="0.5"/>
                <rect x="47" y="47" width="26" height="26" rx="1" fill="#15110a" stroke="#6a5218" stroke-width="1.5"/>
                <circle cx="60" cy="60" r="50" fill="url(#hi-coin)"/>
                ${content}
            </svg>`;
        }

        // 5. 画线生成器 (阳爻/阴爻)
        function generateLineHtml(isYang, isChanging) {
            const color = isChanging ? '#d45c5c' : '#c9a84c';
            const shadow = isChanging ? 'box-shadow: 0 0 10px rgba(212,92,92,0.5);' : '';
            if (isYang) {
                return `<div class="hex-line-row"><div class="line-yang" style="background:${color};${shadow}"></div></div>`;
            } else {
                return `<div class="hex-line-row"><div class="line-yin-segment" style="background:${color};${shadow}"></div><div class="line-yin-segment" style="background:${color};${shadow}"></div></div>`;
            }
        }

        // 6. 核心逻辑：进入摇卦阶段
        function startTossing() {
            appState.question = document.getElementById('question-input').value.trim();
            document.getElementById('phase-welcome').classList.add('hidden');
            document.getElementById('phase-tossing').classList.remove('hidden');
            renderTossStagePlaceholderCoins();
            updateProgressDots();
        }

        // 渲染静态初始状态的铜钱
        function renderTossStagePlaceholderCoins() {
            const stage = document.getElementById('coin-stage');
            stage.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const el = document.createElement('div');
                el.className = 'coin-wrapper';
                el.style.left = '50%';
                el.style.top = '50%';
                el.style.transform = `translate(${COIN_LAYOUTS[i].x - 36}px, ${COIN_LAYOUTS[i].y - 36}px) rotate(${COIN_LAYOUTS[i].r}deg)`;
                el.innerHTML = createCoinSvgHtml(true); // 默认字面
                stage.appendChild(el);
            }
        }

        // 更新进度条
        function updateProgressDots() {
            const dots = document.querySelectorAll('#toss-progress .progress-dot');
            dots.forEach((dot, idx) => {
                dot.className = 'progress-dot';
                if (idx < appState.currentTossIndex) {
                    dot.classList.add('done');
                } else if (idx === appState.currentTossIndex) {
                    dot.classList.add('active');
                }
            });
        }

        // 7. 掷币动作控制器
        function handleTossAction() {
            if (appState.isAnimating) return;

            if (!appState.hasTossedCurrentRound) {
                // 执行摇卦
                executeCoinTossAnimation();
            } else {
                // 进入下一轮或看结果
                goToNextRound();
            }
        }

        // 执行掷硬币动画
        function executeCoinTossAnimation() {
            appState.isAnimating = true;
            const stage = document.getElementById('coin-stage');
            
            // 开启震动动画
            stage.classList.add('shaking');
            document.getElementById('toss-tip').innerText = "铜钱在盘中翻滚...";

            setTimeout(() => {
                // 停止震动动画并计算数据
                stage.classList.remove('shaking');
                
                // 随机掷钱：2为字(正面)，3为背(反面)
                const coins = [0, 0, 0].map(() => Math.random() < 0.5 ? 2 : 3);
                const sum = coins.reduce((a, b) => a + b, 0);
                
                // 判断爻象
                let value, changing, type, desc;
                if (sum === 6) {
                    value = 0; changing = true; type = '老阴';
                    desc = '三枚皆为字面，得老阴 —— 此爻为阴，且为【动爻】，将发生衍变。';
                } else if (sum === 7) {
                    value = 1; changing = false; type = '少阳';
                    desc = '两字一背，得少阳 —— 此爻为阳，安定沉稳。';
                } else if (sum === 8) {
                    value = 0; changing = false; type = '少阴';
                    desc = '一字两背，得少阴 —— 此爻为阴，安定沉稳。';
                } else {
                    value = 1; changing = true; type = '老阳';
                    desc = '三枚皆为背面，得老阳 —— 此爻为阳，且为【动爻】，将发生衍变。';
                }

                const currentTossResult = { coins, sum, value, changing, type, desc };
                appState.tosses.push(currentTossResult);

                // 渲染结果硬币
                stage.innerHTML = '';
                coins.forEach((c, i) => {
                    const el = document.createElement('div');
                    el.className = 'coin-wrapper';
                    el.style.left = '50%';
                    el.style.top = '50%';
                    el.style.transform = `translate(${COIN_LAYOUTS[i].x - 36}px, ${COIN_LAYOUTS[i].y - 36}px) rotate(${COIN_LAYOUTS[i].r + (Math.random()*20-10)}deg)`;
                    el.innerHTML = createCoinSvgHtml(c === 2);
                    stage.appendChild(el);
                });

                // 显示断语文本卡片
                const resultCard = document.getElementById('toss-result-card');
                resultCard.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
                        <span style="font-family:serif; font-size:16px; color:${changing?'#d45c5c':'#c9a84c'}; font-weight:bold;">${type}</span>
                        ${changing ? '<span style="font-size:11px; color:#d45c5c; background:rgba(212,92,92,0.12); padding:2px 8px; border-radius:10px;">动爻</span>' : ''}
                    </div>
                    <div style="font-size:13.5px; color:#b0a898; line-height:1.6;">${desc}</div>
                `;
                resultCard.classList.remove('hidden');

                // 更新实时预览图形
                const previewArea = document.getElementById('live-hex-preview');
                previewArea.style.display = 'flex';
                // 插入到最前面（自下而上堆叠）
                const lineHtml = generateLineHtml(value === 1, changing);
                previewArea.insertAdjacentHTML('afterbegin', lineHtml);

                // 更改按钮文字
                appState.hasTossedCurrentRound = true;
                appState.isAnimating = false;
                
                if (appState.currentTossIndex === 5) {
                    document.getElementById('btn-action').innerText = "查看最终卦象";
                } else {
                    document.getElementById('btn-action').innerText = "确认，掷下一爻";
                }

            }, 700);
        }

        // 推进到下一爻
        function goToNextRound() {
            if (appState.currentTossIndex < 5) {
                appState.currentTossIndex++;
                appState.hasTossedCurrentRound = false;
                
                // 重置UI
                document.getElementById('toss-result-card').classList.add('hidden');
                document.getElementById('current-yao-title').innerText = `第 ${YAO_INDEX_NAMES[appState.currentTossIndex]} 爻`;
                document.getElementById('toss-tip').innerText = "意念集中，点击下方按钮掷出铜钱";
                document.getElementById('btn-action').innerText = "掷 铜 钱";
                
                updateProgressDots();
                renderTossStagePlaceholderCoins();
            } else {
                // 六爻全满，计算结果并进入古籍断解
                renderFinalReadingResult();
            }
        }

        // 8. 核心算法：计算本卦与变卦并展示原文
        function renderFinalReadingResult() {
            document.getElementById('phase-tossing').classList.add('hidden');
            document.getElementById('phase-reading').classList.remove('hidden');

            const lines = appState.tosses.map(t => t.value);
            const changingLines = appState.tosses.map(t => t.changing);
            const hasChanging = changingLines.some(Boolean);

            // 获取本卦卦号
            function getTrigramVal(arr) {
                return arr[0] + arr[1] * 2 + arr[2] * 4;
            }
            const lowerVal = getTrigramVal(lines.slice(0, 3));
            const upperVal = getTrigramVal(lines.slice(3, 6));
            const hexNum = HEX_LOOKUP[upperVal][lowerVal];
            const hexData = HEXAGRAMS[hexNum];

            // 计算变卦
            let changedHexData = null;
            if (hasChanging) {
                const changedLines = lines.map((v, i) => changingLines[i] ? (v === 1 ? 0 : 1) : v);
                const clowerVal = getTrigramVal(changedLines.slice(0, 3));
                const cupperVal = getTrigramVal(changedLines.slice(3, 6));
                const cHexNum = HEX_LOOKUP[cupperVal][clowerVal];
                changedHexData = HEXAGRAMS[cHexNum];
            }

            // A. 填充看板信息
            document.getElementById('read-hex-name').innerText = hexData.name;
            document.getElementById('read-hex-title').innerText = `${hexData.title} · 第 ${hexNum} 卦`;
            
            // 绘制最终图形
            const visualBox = document.getElementById('final-hex-visual');
            visualBox.innerHTML = '';
            lines.forEach((v, idx) => {
                visualBox.insertAdjacentHTML('afterbegin', generateLineHtml(v === 1, changingLines[idx]));
            });

            // 处理所问问题
            if (appState.question) {
                document.getElementById('read-question-row').classList.remove('hidden');
                document.getElementById('read-question-text').innerText = appState.question;
            }

            // 处理变卦小标题
            const bianguaTitleEl = document.getElementById('read-biangua-title');
            if (changedHexData) {
                bianguaTitleEl.innerText = `之卦（变卦）➔ ${changedHexData.title}`;
                bianguaTitleEl.classList.remove('hidden');
            } else {
                bianguaTitleEl.classList.add('hidden');
            }

            // B. 填充本卦古籍原卦辞
            document.getElementById('text-gua-title').innerText = `${hexData.title} 原文卦辞`;
            document.getElementById('text-gua-content').innerText = hexData.gua;

            // C. 循环填充六条原本爻辞
            const yaociListContainer = document.getElementById('text-yaoci-list');
            yaociListContainer.innerHTML = '';
            
            hexData.yao.forEach((yaoText, idx) => {
                const isYangYao = lines[idx] === 1;
                const typeName = isYangYao ? '九' : '六';
                
                let positionTitle = '';
                if (idx === 0) positionTitle = `初${typeName}`;
                else if (idx === 5) positionTitle = `上${typeName}`;
                else positionTitle = `${typeName}${YAO_POSITION_NAMES[idx]}`;

                const isThisYaoChanging = changingLines[idx];

                const yaoItemHtml = `
                    <div class="yao-item ${isThisYaoChanging ? 'changing' : ''}">
                        <span class="yao-title traditional-font" style="color:${isThisYaoChanging ? '#d45c5c' : '#c9a84c'};">
                            ${positionTitle} ${isThisYaoChanging ? ' 动' : ''}
                        </span>
                        <span class="yao-text">${yaoText}</span>
                    </div>
                `;
                // 原文爻辞习惯上在列表里自下而上排列或常规排列，这里直接按下标1-6依次罗列更方便手机阅读
                yaociListContainer.insertAdjacentHTML('beforeend', yaoItemHtml);
            });

            // D. 填充变卦原古籍断语
            const bianguaBlock = document.getElementById('text-biangua-block');
            if (changedHexData) {
                document.getElementById('text-biangua-title').innerText = `✦ 衍伸变卦辞：${changedHexData.title}`;
                document.getElementById('text-biangua-content').innerText = changedHexData.gua;
                bianguaBlock.classList.remove('hidden');
            } else {
                bianguaBlock.classList.add('hidden');
            }
        }

        // 9. 应用完全重置
        function resetApp() {
            appState = {
                question: '',
                currentTossIndex: 0,
                tosses: [],
                isAnimating: false,
                hasTossedCurrentRound: false
            };
            document.getElementById('question-input').value = '';
            document.getElementById('toss-result-card').classList.add('hidden');
            document.getElementById('live-hex-preview').innerHTML = '<div style="font-size: 11px; color: #6a5f52; margin-top: 4px; width:100%; text-align:center;">已成初生卦象</div>';
            document.getElementById('live-hex-preview').style.display = 'none';
            document.getElementById('current-yao-title').innerText = "第 一 爻";
            document.getElementById('toss-tip').innerText = "意念集中，点击下方按钮掷出铜钱";
            document.getElementById('btn-action').innerText = "掷 铜 钱";

            document.getElementById('phase-reading').classList.add('hidden');
            document.getElementById('phase-welcome').classList.remove('hidden');
        }
    </script>
</body>
</html>
