<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const HEX_LOOKUP=[[2,24,7,45,15,36,46,11],[16,51,3,17,27,21,42,34],[8,40,29,47,4,64,59,6],[19,54,60,58,41,38,61,10],[23,62,39,31,52,56,53,33],[35,55,63,49,22,30,37,13],[20,32,48,28,18,50,57,44],[12,25,5,43,26,14,9,1]];
const HEXAGRAMS={1:{name:'乾',title:'乾为天',gua:'元亨，利贞。',yao:['潜龙勿用。','见龙在田，利见大人。','君子终日乾乾，夕惕若厉，无咎。','或跃在渊，无咎。','飞龙在天，利见大人。','亢龙有悔。']},2:{name:'坤',title:'坤为地',gua:'元亨，利牝马之贞。',yao:['履霜，坚冰至。','直方大，不习无不利。','含章可贞。或从王事，无成有终。','括囊，无咎无誉。','黄裳，元吉。','龙战于野，其血玄黄。']},3:{name:'屯',title:'水雷屯',gua:'元亨，利贞。勿用有攸往，利建侯。',yao:['磐桓，利居贞，利建侯。','屯如邅如，乘马班如。匪寇，婚媾。','即鹿无虞，惟入于林中。君子几不如舍，往吝。','乘马班如，求婚媾。往吉，无不利。','屯其膏，小贞吉，大贞凶。','乘马班如，泣血涟如。']},4:{name:'蒙',title:'山水蒙',gua:'亨。匪我求童蒙，童蒙求我。',yao:['发蒙，利用刑人，用说桎梏，以往吝。','包蒙，吉。纳妇，吉。子克家。','勿用取女，见金夫，不有躬。无攸利。','困蒙，吝。','童蒙，吉。','击蒙，不利为寇，利御寇。']},5:{name:'需',title:'水天需',gua:'有孚，光亨，贞吉。利涉大川。',yao:['需于郊，利用恒，无咎。','需于沙，小有言，终吉。','需于泥，致寇至。','需于血，出自穴。','需于酒食，贞吉。','入于穴，有不速之客三人来，敬之终吉。']},6:{name:'讼',title:'天水讼',gua:'有孚窒惕，中吉，终凶。',yao:['不永所事，小有言，终吉。','不克讼，归而逋。其邑人三百户，无眚。','食旧德，贞厉，终吉。或从王事，无成。','不克讼，复即命渝，安贞吉。','讼，元吉。','或锡之鞶带，终朝三褫之。']},7:{name:'师',title:'地水师',gua:'贞，丈人吉，无咎。',yao:['师出以律，否臧凶。','在师中，吉，无咎。王三锡命。','师或舆尸，凶。','师左次，无咎。','田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。','大君有命，开国承家，小人勿用。']},8:{name:'比',title:'地水比',gua:'吉。原筮，元永贞，无咎。',yao:['有孚比之，无咎。有孚盈缶，终来有它吉。','比之自内，贞吉。','比之匪人。','外比之，贞吉。','显比，王用三驱，失前禽，邑人不诫，吉。','比之无首，凶。']},9:{name:'小畜',title:'风天小畜',gua:'亨。密云不雨，自我西郊。',yao:['复自道，何其咎，吉。','牵复，吉。','舆说辐，夫妻反目。','有孚，血去惕出，无咎。','有孚挛如，富以其邻。','既雨既处，尚德载。妇贞厉。']},10:{name:'履',title:'天泽履',gua:'履虎尾，不咥人。亨。',yao:['素履往，无咎。','履道坦坦，幽人贞吉。','眇能视，跛能履。履虎尾，咥人凶。武人为于大君。','履虎尾，愬愬，终吉。','夬履，贞厉。','视履考祥，其旋元吉。']},11:{name:'泰',title:'地天泰',gua:'小往大来，吉，亨。',yao:['拔茅茹以其汇，征吉。','包荒，用冯河，不遐遗。朋亡，得尚于中行。','无平不陂，无往不复。艰贞无咎。','翩翩，不富以其邻，不戒以孚。','帝乙归妹，以祉元吉。','城复于隍，勿用师，自邑告命。贞吝。']},12:{name:'否',title:'天地否',gua:'否之匪人，不利君子贞。大往小来。',yao:['拔茅茹以其汇，贞吉，亨。','包承，小人吉，大人否亨。','包羞。','有命无咎，畴离祉。','休否，大人吉。其亡其亡，系于苞桑。','倾否，先否后喜。']},13:{name:'同人',title:'天火同人',gua:'同人于野，亨。利涉大川。',yao:['同人于门，无咎。','同人于宗，吝。','伏戎于莽，升其高陵，三岁不兴。','乘其墉，弗克攻，吉。','同人先号咷而后笑，大师克相遇。','同人于郊，无悔。']},14:{name:'大有',title:'火天大有',gua:'元亨。',yao:['无交害，匪咎。艰则无咎。','大车以载，有攸往，无咎。','公用亨于天子，小人弗克。','匪其彭，无咎。','厥孚交如，威如，吉。','自天祐之，吉，无不利。']},15:{name:'谦',title:'地山谦',gua:'亨，君子有终。',yao:['谦谦君子，用涉大川，吉。','鸣谦，贞吉。','劳谦，君子有终，吉。','无不利，撝谦。','不富以其邻，利用侵伐，无不利。','鸣谦，利用行师征邑国。']},16:{name:'豫',title:'雷地豫',gua:'利建侯行师。',yao:['鸣豫，凶。','介于石，不终日，贞吉。','盱豫，悔，迟有悔。','由豫，大有得，勿疑。朋盍簪。','贞疾，恒不死。','冥豫，成有渝，无咎。']},17:{name:'随',title:'泽雷随',gua:'元亨，利贞，无咎。',yao:['官有渝，贞吉。出门交有功。','系小子，失丈夫。','系丈夫，失小子。随有求得，利居贞。','随有获，贞凶。有孚在道，以明，何咎。','孚于嘉，吉。','拘系之，乃从维之。王用亨于西山。']},18:{name:'蛊',title:'山风蛊',gua:'元亨，利涉大川。',yao:['干父之蛊，有子，考无咎，厉终吉。','干母之蛊，不可贞。','干父之蛊，小有悔，无大咎。','裕父之蛊，往见吝。','干父之蛊，用誉。','不事王侯，高尚其事。']},19:{name:'临',title:'地泽临',gua:'元亨，利贞。至于八月有凶。',yao:['咸临，贞吉。','咸临，吉，无不利。','甘临，无攸利。既忧之，无咎。','至临，无咎。','知临，大君之宜，吉。','敦临，吉，无咎。']},20:{name:'观',title:'风地观',gua:'盥而不荐，有孚颙若。',yao:['童观，小人无咎，君子吝。','窥观，利女贞。','观我生，进退。','观国之光，利用宾于王。','观我生，君子无咎。','观其生，君子无咎。']},21:{name:'噬嗑',title:'火雷噬嗑',gua:'亨，利用狱。',yao:['屦校灭趾，无咎。','噬肤灭鼻，无咎。','噬腊肉，遇毒。小吝，无咎。','噬干胏，得金矢。利艰贞，吉。','噬干肉，得黄金。贞厉，无咎。','何校灭耳，凶。']},22:{name:'贲',title:'山火贲',gua:'亨，小利有攸往。',yao:['贲其趾，舍车而徒。','贲其须。','贲如濡如，永贞吉。','贲如皤如，白马翰如。匪寇，婚媾。','贲于丘园，束帛戋戋。吝，终吉。','白贲，无咎。']},23:{name:'剥',title:'山地剥',gua:'不利有攸往。',yao:['剥床以足，蔑贞凶。','剥床以辨，蔑贞凶。','剥之，无咎。','剥床以肤，凶。','贯鱼，以宫人宠，无不利。','硕果不食，君子得舆，小人剥庐。']},24:{name:'复',title:'地雷复',gua:'亨。出入无疾，朋来无咎。反复其道，七日来复。',yao:['不远复，无祗悔，元吉。','休复，吉。','频复，厉，无咎。','中行独复。','敦复，无悔。','迷复，凶，有灾眚。']},25:{name:'无妄',title:'天雷无妄',gua:'元亨，利贞。其匪正有眚，不利有攸往。',yao:['无妄往，吉。','不耕获，不菑畬，则利有攸往。','无妄之灾，或系之牛。行人之得，邑人之灾。','可贞，无咎。','无妄之疾，勿药有喜。','无妄行，有眚，无攸利。']},26:{name:'大畜',title:'山天大畜',gua:'利贞。不家食吉，利涉大川。',yao:['有厉，利已。','舆说辐。','良马逐，利艰贞。日闲舆卫，利有攸往。','童牛之牿，元吉。','豮豕之牙，吉。','何天之衢，亨。']},27:{name:'颐',title:'山雷颐',gua:'贞吉。观颐，自求口实。',yao:['舍尔灵龟，观我朵颐，凶。','颠颐，拂经于丘颐，征凶。','拂颐，贞凶。十年勿用，无攸利。','颠颐，吉。虎视眈眈，其欲逐逐，无咎。','拂经，居贞吉。不可涉大川。','由颐，厉吉。利涉大川。']},28:{name:'大过',title:'泽风大过',gua:'栋桡，利有攸往，亨。',yao:['藉用白茅，无咎。','枯杨生稊，老夫得其女妻，无不利。','栋桡，凶。','栋隆，吉。有它吝。','枯杨生华，老妇得其士夫。无咎无誉。','过涉灭顶，凶，无咎。']},29:{name:'坎',title:'坎为水',gua:'习坎，有孚，维心亨，行有尚。',yao:['习坎，入于坎窞，凶。','坎有险，求小得。','来之坎坎，险且枕，入于坎窞，勿用。','樽酒簋贰，用缶，纳约自牖，终无咎。','坎不盈，祗既平，无咎。','系用徽纆，寘于丛棘，三岁不得，凶。']},30:{name:'离',title:'离为火',gua:'利贞，亨。畜牝牛，吉。',yao:['履错然，敬之无咎。','黄离，元吉。','日昃之离，不鼓缶而歌，则大耋之嗟，凶。','突如其来如，焚如，死如，弃如。','出涕沱若，戚嗟若，吉。','王用出征，有嘉折首，获匪其丑，无咎。']},31:{name:'咸',title:'泽山咸',gua:'亨，利贞。取女吉。',yao:['咸其拇。','咸其腓，凶。居吉。','咸其股，执其随，往吝。','贞吉悔亡。憧憧往来，朋从尔思。','咸其脢，无悔。','咸其辅颊舌。']},32:{name:'恒',title:'雷风恒',gua:'亨，无咎，利贞。利有攸往。',yao:['浚恒，贞凶。无攸利。','悔亡。','不恒其德，或承之羞，贞吝。','田无禽。','恒其德，贞，妇人吉，夫子凶。','振恒，凶。']},33:{name:'遁',title:'天山遁',gua:'亨，小利贞。',yao:['遁尾，厉，勿用有攸往。','执之用黄牛之革，莫之胜说。','系遁，有疾厉。畜臣妾吉。','好遁，君子吉，小人否。','嘉遁，贞吉。','肥遁，无不利。']},34:{name:'大壮',title:'雷天大壮',gua:'利贞。',yao:['壮于趾，征凶，有孚。','贞吉。','小人用壮，君子用罔。贞厉。','贞吉悔亡，藩决不羸。壮于大舆之輹。','丧羊于易，无悔。','羝羊触藩，不能退，不能遂。无攸利，艰则吉。']},35:{name:'晋',title:'火地晋',gua:'康侯用锡马蕃庶，昼日三接。',yao:['晋如摧如，贞吉。罔孚裕，无咎。','晋如愁如，贞吉。受兹介福，于其王母。','众允，悔亡。','晋如鼫鼠，贞厉。','悔亡，失得勿恤。往吉，无不利。','晋其角，维用伐邑。厉吉无咎，贞吝。']},36:{name:'明夷',title:'地火明夷',gua:'利艰贞。',yao:['明夷于飞，垂其翼。君子于行，三日不食。','明夷，夷于左股，用拯马壮，吉。','明夷于南狩，得其大首。不可疾贞。','入于左腹，获明夷之心，于出门庭。','箕子之明夷，利贞。','不明晦，初登于天，后入于地。']},37:{name:'家人',title:'风火家人',gua:'利女贞。',yao:['闲有家，悔亡。','无攸遂，在中馈，贞吉。','家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。','富家，大吉。','王假有家，勿恤，吉。','有孚威如，终吉。']},38:{name:'睽',title:'火泽睽',gua:'小事吉。',yao:['悔亡，丧马勿逐，自复。见恶人，无咎。','遇主于巷，无咎。','见舆曳，其牛掣，其人天且劓。无初有终。','睽孤，遇元夫，交孚。厉无咎。','悔亡，厥宗噬肤。往何咎。','睽孤，见豕负涂，载鬼一车。先张之弧，后说之弧。匪寇婚媾，往遇雨则吉。']},39:{name:'蹇',title:'水山蹇',gua:'利西南，不利东北。利见大人，贞吉。',yao:['往蹇来誉。','王臣蹇蹇，匪躬之故。','往蹇来反。','往蹇来连。','大蹇朋来。','往蹇来硕，吉。利见大人。']},40:{name:'解',title:'雷水解',gua:'利西南。无所往，其来复吉。有攸往，夙吉。',yao:['无咎。','田获三狐，得黄矢。贞吉。','负且乘，致寇至，贞吝。','解而拇，朋至斯孚。','君子维有解，吉。有孚于小人。','公用射隼于高墉之上，获之，无不利。']},41:{name:'损',title:'山泽损',gua:'有孚，元吉，无咎，可贞。利有攸往。',yao:['已事遄往，无咎，酌损之。','利贞，征凶。弗损益之。','三人行则损一人，一人行则得其友。','损其疾，使遄有喜，无咎。','或益之十朋之龟，弗克违。元吉。','弗损益之，无咎。贞吉。利有攸往，得臣无家。']},42:{name:'益',title:'风雷益',gua:'利有攸往，利涉大川。',yao:['利用为大作，元吉，无咎。','或益之十朋之龟，弗克违。永贞吉。','益之用凶事，无咎。有孚中行，告公用圭。','中行告公从，利用为依迁国。','有孚惠心，勿问元吉。有孚惠我德。','莫益之，或击之。立心勿恒，凶。']},43:{name:'夬',title:'泽天夬',gua:'扬于王庭，孚号有厉。告自邑，不利即戎。',yao:['壮于前趾，往不胜为咎。','惕号，莫夜有戎，勿恤。','壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。','臀无肤，其行次且。牵羊悔亡，闻言不信。','苋陆夬夬，中行无咎。','无号，终有凶。']},44:{name:'姤',title:'天风姤',gua:'女壮，勿用取女。',yao:['系于金柅，贞吉。有攸往，见凶。','包有鱼，无咎，不利宾。','臀无肤，其行次且。厉，无大咎。','包无鱼，起凶。','以杞包瓜，含章，有陨自天。','姤其角，吝，无咎。']},45:{name:'萃',title:'泽地萃',gua:'亨。王假有庙。利见大人，亨，利贞。',yao:['有孚不终，乃乱乃萃。若号，一握为笑。勿恤，往无咎。','引吉，无咎。孚乃利用禴。','萃如嗟如，无攸利。往无咎，小吝。','大吉，无咎。','萃有位，无咎。匪孚，元永贞，悔亡。','赍咨涕洟，无咎。']},46:{name:'升',title:'地风升',gua:'元亨，用见大人，勿恤。南征吉。',yao:['允升，大吉。','孚乃利用禴，无咎。','升虚邑。','王用亨于岐山，吉，无咎。','贞吉，升阶。','冥升，利于不息之贞。']},47:{name:'困',title:'泽水困',gua:'亨，贞，大人吉，无咎。有言不信。',yao:['臀困于株木，入于幽谷，三岁不觌。','困于酒食，朱绂方来。利用享祀，征凶，无咎。','困于石，据于蒺藜。入于其宫，不见其妻，凶。','来徐徐，困于金车。吝，有终。','劓刖，困于赤绂。乃徐有说，利用祭祀。','困于葛藟，于臲卼。曰动悔有悔，征吉。']},48:{name:'井',title:'水风井',gua:'改邑不改井，无丧无得。往来井井。',yao:['井泥不食，旧井无禽。','井谷射鲋，瓮敝漏。','井渫不食，为我心恻。可用汲，王明，并受其福。','井甃，无咎。','井冽寒泉，食。','井收勿幕，有孚元吉。']},49:{name:'革',title:'泽火革',gua:'巳日乃孚。元亨利贞，悔亡。',yao:['巩用黄牛之革。','巳日乃革之。征吉，无咎。','征凶，贞厉。革言三就，有孚。','悔亡，有孚改命，吉。','大人虎变，未占有孚。','君子豹变，小人革面。征凶，居贞吉。']},50:{name:'鼎',title:'火风鼎',gua:'元吉，亨。',yao:['鼎颠趾，利出否。得妾以其子，无咎。','鼎有实，我仇有疾，不我能即，吉。','鼎耳革，其行塞。雉膏不食，方雨亏悔，终吉。','鼎折足，覆公餗，其形渥，凶。','鼎黄耳金铉，利贞。','鼎玉铉，大吉，无不利。']},51:{name:'震',title:'震为雷',gua:'亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。',yao:['震来虩虩，后笑言哑哑，吉。','震来厉。亿丧贝，跻于九陵，勿逐，七日得。','震苏苏，震行无眚。','震遂泥。','震往来厉，亿无丧，有事。','震索索，视矍矍，征凶。']},52:{name:'艮',title:'艮为山',gua:'艮其背，不获其身。行其庭，不见其人。无咎。',yao:['艮其趾，无咎。利永贞。','艮其腓，不拯其随，其心不快。','艮其限，列其夤，厉薰心。','艮其身，无咎。','艮其辅，言有序，悔亡。','敦艮，吉。']},53:{name:'渐',title:'风山渐',gua:'女归吉，利贞。',yao:['鸿渐于干，小子厉，有言，无咎。','鸿渐于磐，饮食衎衎，吉。','鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。','鸿渐于木，或得其桷，无咎。','鸿渐于陵，妇三岁不孕，终莫之胜，吉。','鸿渐于陆，其羽可用为仪，吉。']},54:{name:'归妹',title:'雷泽归妹',gua:'征凶，无攸利。',yao:['归妹以娣，跛能履，征吉。','眇能视，利幽人之贞。','归妹以须，反归以娣。','归妹愆期，迟归有时。','帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。','女承筐无实，士刲羊无血，无攸利。']},55:{name:'丰',title:'雷火丰',gua:'亨，王假之。勿忧，宜日中。',yao:['遇其配主，虽旬无咎，往有尚。','丰其蔀，日中见斗。往得疑疾，有孚发若，吉。','丰其沛，日中见沬。折其右肱，无咎。','丰其蔀，日中见斗。遇其夷主，吉。','来章，有庆誉，吉。','丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。']},56:{name:'旅',title:'火山旅',gua:'小亨，旅贞吉。',yao:['旅琐琐，斯其所取灾。','旅即次，怀其资，得童仆贞。','旅焚其次，丧其童仆，贞厉。','旅于处，得其资斧，我心不快。','射雉一矢亡，终以誉命。','鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。']},57:{name:'巽',title:'巽为风',gua:'小亨，利有攸往，利见大人。',yao:['进退，利武人之贞。','巽在床下，用史巫纷若，吉，无咎。','频巽，吝。','悔亡，田获三品。','贞吉悔亡，无不利。无初有终。','巽在床下，丧其资斧。贞凶。']},58:{name:'兑',title:'兑为泽',gua:'亨，利贞。',yao:['和兑，吉。','孚兑，吉，悔亡。','来兑，凶。','商兑未宁，介疾有喜。','孚于剥，有厉。','引兑。']},59:{name:'涣',title:'风水涣',gua:'亨。王假有庙，利涉大川，利贞。',yao:['用拯马壮，吉。','涣奔其机，悔亡。','涣其躬，无悔。','涣其群，元吉。涣有丘，匪夷所思。','涣汗其大号，涣王居，无咎。','涣其血去逖出，无咎。']},60:{name:'节',title:'水泽节',gua:'亨。苦节不可贞。',yao:['不出户庭，无咎。','不出门庭，凶。','不节若，则嗟若，无咎。','安节，亨。','甘节，吉。往有尚。','苦节，贞凶，悔亡。']},61:{name:'中孚',title:'风泽中孚',gua:'豚鱼吉，利涉大川，利贞。',yao:['虞吉，有它不燕。','鹤鸣在阴，其子和之。我有好爵，吾与尔靡之。','得敌，或鼓或罢，或泣或歌。','月几望，马匹亡，无咎。','有孚挛如，无咎。','翰音登于天，贞凶。']},62:{name:'小过',title:'雷山小过',gua:'亨，利贞。可小事，不可大事。',yao:['飞鸟以凶。','过其祖，遇其妣。不及其君，遇其臣，无咎。','弗过防之，从或戕之，凶。','无咎，弗过遇之。往厉必戒，勿用永贞。','密云不雨，自我西郊。公弋取彼在穴。','弗遇过之，飞鸟离之，凶。是谓灾眚。']},63:{name:'既济',title:'水火既济',gua:'亨小，利贞。初吉终乱。',yao:['曳其轮，濡其尾，无咎。','妇丧其茀，勿逐，七日得。','高宗伐鬼方，三年克之。小人勿用。','繻有衣袽，终日戒。','东邻杀牛，不如西邻之禴祭，实受其福。','濡其首，厉。']},64:{name:'未济',title:'火水未济',gua:'亨。小狐汔济，濡其尾，无攸利。',yao:['濡其尾，吝。','曳其轮，贞吉。','未济，征凶，利涉大川。','贞吉悔亡，震用伐鬼方，三年有赏于大国。','贞吉，无悔。君子之光，有孚，吉。','有孚于饮酒，无咎。濡其首，有孚失是。']}};

const YAO_NAMES=['初','二','三','四','五','上'];
function getTrigramVal(l){return l[0]+l[1]*2+l[2]*4}
function getHexNumber(l){return HEX_LOOKUP[getTrigramVal(l.slice(3,6))][getTrigramVal(l.slice(0,3))]}
function tossCoin(){const c=[0,0,0].map(()=>Math.random()<0.5?2:3);return{coins:c,sum:c.reduce((a,b)=>a+b,0)}}
function sumToYao(s){if(s===6)return{value:0,changing:true,type:'老阴'};if(s===7)return{value:1,changing:false,type:'少阳'};if(s===8)return{value:0,changing:false,type:'少阴'};return{value:1,changing:true,type:'老阳'};}

function SongCoin({isCharSide, size=76, coinId='x'}){
  const id='c'+coinId;
  return (
    <svg width={size} height={size} viewBox="0 0 120 120">
      <defs>
        <radialGradient id={`bg-${id}`} cx="40%" cy="36%">
          <stop offset="0%" stopColor={isCharSide?"#c4a24e":"#b89840"}/>
          <stop offset="30%" stopColor={isCharSide?"#a8843a":"#9c7a32"}/>
          <stop offset="70%" stopColor={isCharSide?"#7c5e22":"#72561c"}/>
          <stop offset="100%" stopColor={isCharSide?"#5a4214":"#503c10"}/>
        </radialGradient>
        <radialGradient id={`hi-${id}`} cx="35%" cy="30%">
          <stop offset="0%" stopColor="rgba(255,240,180,0.18)"/>
          <stop offset="100%" stopColor="rgba(255,240,180,0)"/>
        </radialGradient>
        <filter id={`ds-${id}`}>
          <feDropShadow dx="0" dy="3" stdDeviation="5" floodColor="#000" floodOpacity="0.55"/>
        </filter>
      </defs>
      <circle cx="60" cy="60" r="56" fill={`url(#bg-${id})`} filter={`url(#ds-${id})`}/>
      <circle cx="60" cy="60" r="56" fill="none" stroke="#8a6e28" strokeWidth="2.5"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(200,170,70,0.2)" strokeWidth="0.6"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(120,90,30,0.25)" strokeWidth="0.5"/>
      <rect x="47" y="47" width="26" height="26" rx="1" fill="#15110a" stroke="#6a5218" strokeWidth="1.5"/>
      <circle cx="60" cy="60" r="50" fill={`url(#hi-${id})`}/>
      {isCharSide ? (<>
        <text x="60" y="40" textAnchor="middle" fontSize="17" fontWeight="800" fontFamily="serif" fill="#3a2a0a" opacity="0.82">崇</text>
        <text x="60" y="90" textAnchor="middle" fontSize="17" fontWeight="800" fontFamily="serif" fill="#3a2a0a" opacity="0.82">寶</text>
        <text x="86" y="66" textAnchor="middle" fontSize="17" fontWeight="800" fontFamily="serif" fill="#3a2a0a" opacity="0.82">通</text>
        <text x="34" y="66" textAnchor="middle" fontSize="17" fontWeight="800" fontFamily="serif" fill="#3a2a0a" opacity="0.82">寧</text>
        <circle cx="28" cy="34" r="4" fill="rgba(68,92,58,0.1)"/>
        <circle cx="85" cy="82" r="6" fill="rgba(58,82,52,0.08)"/>
      </>) : (<>
        <path d="M 60 26 Q 68 32 60 38 Q 55 32 60 26" fill="none" stroke="#5a4820" strokeWidth="1.3" opacity="0.4"/>
        <circle cx="72" cy="86" r="1.8" fill="#5a4820" opacity="0.25"/>
        <circle cx="32" cy="72" r="8" fill="rgba(58,78,48,0.08)"/>
        <circle cx="80" cy="38" r="10" fill="rgba(52,72,42,0.06)"/>
      </>)}
      <circle cx="60" cy="60" r="55.5" fill="none" stroke="rgba(220,200,140,0.06)" strokeWidth="1.5"/>
    </svg>
  );
}

function HexLine({isYang,isChanging,animated,delay=0}){
  const c=isChanging?'#d45c5c':'#c9a84c';
  const sh=isChanging?'0 0 10px rgba(212,92,92,0.4)':'none';
  const s={display:'flex',gap:10,justifyContent:'center',alignItems:'center',opacity:animated?1:0,transform:animated?'translateX(0)':'translateX(-20px)',transition:`all 0.4s ease ${delay}s`};
  if(isYang) return (<div style={s}><div style={{width:120,height:10,borderRadius:2,background:c,boxShadow:sh}}/></div>);
  return (<div style={s}><div style={{width:52,height:10,borderRadius:2,background:c,boxShadow:sh}}/><div style={{width:52,height:10,borderRadius:2,background:c,boxShadow:sh}}/></div>);
}

function App(){
  const [phase,setPhase]=useState('welcome');
  const [question,setQuestion]=useState('');
  const [tossIndex,setTossIndex]=useState(0);
  const [tosses,setTosses]=useState([]);
  const [coinAnim,setCoinAnim]=useState('idle');
  const [currentCoins,setCurrentCoins]=useState(null);
  const [showTossResult,setShowTossResult]=useState(false);
  
  const [revealStep,setRevealStep]=useState(0);
  const timerRef=useRef(null);

  const particles=useMemo(()=>[...Array(12)].map((_,i)=>({left:10+((i*7+13)%80),top:((i*17+5)%90),dur:10+(i%5)*2,del:i*0.4})),[]);
  const coinLayout=[{x:-82,y:2,r:-6},{x:0,y:-4,r:1},{x:82,y:2,r:5}];

  useEffect(()=>{
    const l=document.createElement('link');
    l.href='https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap';
    l.rel='stylesheet';document.head.appendChild(l);
    return()=>{if(timerRef.current)clearTimeout(timerRef.current)};
  },[]);

  const doToss=()=>{
    const result=tossCoin();const yao=sumToYao(result.sum);
    setCurrentCoins(result.coins);setShowTossResult(false);setCoinAnim('flying');
    timerRef.current=setTimeout(()=>{
      setCoinAnim('landing');
      timerRef.current=setTimeout(()=>{
        setCoinAnim('done');setShowTossResult(true);
        setTosses(prev=>[...prev,{...result,...yao,index:tossIndex}]);
      },650);
    },350);
  };

  const nextToss=()=>{
    if(tossIndex+1>=6){
      setPhase('reveal');let step=0;
      const iv=setInterval(()=>{step++;setRevealStep(step);if(step>=6)clearInterval(iv)},300);
      timerRef.current=setTimeout(()=>setPhase('reading'),2800);return;
    }
    setTossIndex(tossIndex+1);setCoinAnim('idle');setCurrentCoins(null);setShowTossResult(false);
  };

  const reset=()=>{setPhase('welcome');setQuestion('');setTossIndex(0);setTosses([]);setCoinAnim('idle');setCurrentCoins(null);setShowTossResult(false);setRevealStep(0);};

  const lines=tosses.map(t=>t.value),changingLines=tosses.map(t=>t.changing);
  const hasChanging=changingLines.some(Boolean);
  const hexNum=lines.length===6?getHexNumber(lines):null;
  const hexData=hexNum?HEXAGRAMS[hexNum]:null;
  let changedHexNum=null,changedHexData=null;
  if(hasChanging&&lines.length===6){const cl=lines.map((v,i)=>changingLines[i]?(v===1?0:1):v);changedHexNum=getHexNumber(cl);changedHexData=HEXAGRAMS[changedHexNum];}



  function getNarration(toss){
    if(toss.sum===6)return{desc:'三枚皆为字面，得老阴——此爻为阴，且为动爻，将有变化。',hl:true};
    if(toss.sum===7)return{desc:'两字一背，得少阳——此爻为阳，安定不动。',hl:false};
    if(toss.sum===8)return{desc:'一字两背，得少阴——此爻为阴，安定不动。',hl:false};
    return{desc:'三枚皆为背面，得老阳——此爻为阳，且为动爻，将有变化。',hl:true};
  }

  const FH="'Noto Serif SC',serif";
  const card={background:'rgba(26,23,20,0.9)',border:'1px solid rgba(201,168,76,0.15)',borderRadius:16,padding:'24px',marginBottom:20};

  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(180deg,#0c0a08,#1a1510 40%,#0e0c08)',color:'#e8e0d4',fontFamily:"system-ui,sans-serif",position:'relative',overflow:'hidden'}}>
      <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,pointerEvents:'none'}}>
        {particles.map((p,i)=>(
          <div key={i} style={{position:'absolute',left:`${p.left}%`,top:`${p.top}%`,width:2,height:2,background:'rgba(201,168,76,0.1)',borderRadius:'50%',animation:`fl${i%3} ${p.dur}s ease-in-out infinite`,animationDelay:`${p.del}s`}}/>
        ))}
      </div>
      <style>{`
        @keyframes fl0{0%,100%{transform:translateY(0);opacity:0.15}50%{transform:translateY(-50px) translateX(15px);opacity:0.5}}
        @keyframes fl1{0%,100%{opacity:0.1}50%{transform:translateY(-35px) translateX(-20px);opacity:0.4}}
        @keyframes fl2{0%,100%{opacity:0.2}50%{transform:translateY(-60px);opacity:0.35}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes breathe{0%,100%{box-shadow:0 0 20px rgba(201,168,76,0.06)}50%{box-shadow:0 0 40px rgba(201,168,76,0.2)}}
        @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
        @keyframes coinFly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-100px) scale(0.6);opacity:0.4}}
        @keyframes coinLand{0%{opacity:0;transform:scale(0.4) translateY(-30px)}50%{transform:scale(1.04) translateY(3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes typing{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
        .fi{animation:fadeIn 0.6s ease forwards}
        .br{animation:breathe 3s ease-in-out infinite}
        .cFly{animation:coinFly 0.35s ease-in forwards}
        .cLand{animation:coinLand 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards}
        .mBtn{font-family:${FH};font-size:20px;color:#0a0908;background:linear-gradient(135deg,#e8c95a,#c9a84c,#b8942a);border:none;border-radius:50px;padding:16px 48px;cursor:pointer;font-weight:700;letter-spacing:6px;box-shadow:0 4px 20px rgba(201,168,76,0.3);transition:all 0.3s}
        .mBtn:hover{transform:translateY(-2px)}
        .mBtn:disabled{opacity:0.4;cursor:default;transform:none}
        .gBtn{font-family:${FH};font-size:15px;color:#c9a84c;background:transparent;border:1px solid rgba(201,168,76,0.4);border-radius:50px;padding:12px 36px;cursor:pointer;letter-spacing:4px;transition:all 0.3s}
        .gBtn:hover{background:rgba(201,168,76,0.08)}
        details summary{list-style:none} details summary::-webkit-details-marker{display:none}
      `}</style>

      <div style={{maxWidth:440,margin:'0 auto',padding:'32px 20px',position:'relative',zIndex:1}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontSize:12,letterSpacing:10,color:'#8a7f72',fontWeight:300}}>周 易 · 铜 钱 占 法</div>
          <h1 style={{fontFamily:FH,fontSize:40,fontWeight:900,color:'#c9a84c',margin:'8px 0',letterSpacing:10}}>六爻占卦</h1>
          <div style={{width:48,height:2,background:'linear-gradient(90deg,transparent,#c9a84c,transparent)',margin:'0 auto'}}/>
        </div>

        {phase==='welcome'&&(
          <div className="fi" style={{textAlign:'center'}}>
            <div style={card}>
              <div style={{fontFamily:FH,fontSize:18,color:'#e8d48b',lineHeight:2,letterSpacing:1}}>施主请静心</div>
              <div style={{fontSize:13,color:'#8a7f72',marginTop:6,lineHeight:1.8,marginBottom:20}}>占卦之前，请先在心中想好你要问的事情。一事一占，心诚则灵。</div>
              <textarea value={question} onChange={e=>setQuestion(e.target.value)} placeholder="在此写下你想问的事（选填）"
                style={{width:'100%',boxSizing:'border-box',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(201,168,76,0.15)',borderRadius:10,padding:'14px 16px',color:'#e8e0d4',fontFamily:'inherit',fontSize:15,resize:'none',height:72,outline:'none',lineHeight:1.6}}
                onFocus={e=>e.target.style.borderColor='rgba(201,168,76,0.4)'} onBlur={e=>e.target.style.borderColor='rgba(201,168,76,0.15)'}/>
              <div style={{fontSize:13,color:'#6a5f52',lineHeight:2,marginTop:16}}>准备好后，点击下方开始掷铜钱<br/>共需掷六次，每次三枚</div>
            </div>
            <button className="mBtn br" onClick={()=>{setPhase('tossing');setCoinAnim('idle')}}>开始占卦</button>
          </div>
        )}

        {phase==='tossing'&&(
          <div className="fi">
            <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:24}}>
              {[0,1,2,3,4,5].map(i=>(
                <div key={i} style={{width:32,height:4,borderRadius:2,transition:'all 0.3s',background:i<tossIndex?'#c9a84c':i===tossIndex?(showTossResult?'#c9a84c':'rgba(201,168,76,0.5)'):'rgba(201,168,76,0.12)'}}/>
              ))}
            </div>
            <div style={{textAlign:'center',margin:'16px 0'}}>
              <div style={{fontFamily:FH,fontSize:18,color:'#e8d48b',letterSpacing:1}}>第 {tossIndex+1} 爻</div>
              {!showTossResult&&<div style={{fontSize:13,color:'#8a7f72',marginTop:4}}>{tossIndex===0?'凝神静气，掷出铜钱':'继续掷出铜钱'}</div>}
            </div>
            <div style={{background:'radial-gradient(ellipse at center,rgba(55,42,18,0.3),rgba(18,14,8,0.5))',border:'1px solid rgba(201,168,76,0.08)',borderRadius:16,padding:'32px 20px',margin:'16px 0',minHeight:130,position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{position:'absolute',inset:0,borderRadius:16,opacity:0.08,background:'repeating-linear-gradient(92deg,transparent,transparent 28px,rgba(160,120,40,0.15) 28px,rgba(160,120,40,0.15) 29px)',pointerEvents:'none'}}/>
              {coinAnim==='idle'&&!currentCoins&&(
                <div style={{display:'flex',gap:16,opacity:0.35}}>
                  {[0,1,2].map(i=><SongCoin key={i} coinId={`idle${i}`} isCharSide={true} size={68}/>)}
                </div>
              )}
              {currentCoins&&coinAnim==='flying'&&(
                <div style={{display:'flex',gap:16}}>
                  {currentCoins.map((c,i)=>(
                    <div key={i} className="cFly" style={{animationDelay:`${i*0.06}s`}}>
                      <SongCoin coinId={`fly${tossIndex}${i}`} isCharSide={c===2} size={68}/>
                    </div>
                  ))}
                </div>
              )}
              {currentCoins&&(coinAnim==='landing'||coinAnim==='done')&&(
                <div style={{position:'relative',width:260,height:96,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {currentCoins.map((c,i)=>(
                    <div key={i} className="cLand" style={{position:'absolute',left:'50%',top:'50%',marginLeft:coinLayout[i].x-38,marginTop:coinLayout[i].y-38,animationDelay:`${i*0.1}s`}}>
                      <SongCoin coinId={`land${tossIndex}${i}`} isCharSide={c===2} size={76} />
                    </div>
                  ))}
                </div>
              )}
            </div>
            {showTossResult&&tosses[tossIndex]&&(()=>{
              const n=getNarration(tosses[tossIndex]);
              return(
                <div className="fi" style={{...card,padding:'16px 20px',margin:'16px 0'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                    <span style={{fontFamily:FH,fontSize:15,color:n.hl?'#d45c5c':'#c9a84c',fontWeight:700}}>{tosses[tossIndex].type}</span>
                    {n.hl&&<span style={{fontSize:10,color:'#d45c5c',background:'rgba(212,92,92,0.12)',padding:'2px 8px',borderRadius:10}}>动爻</span>}
                  </div>
                  <div style={{fontSize:14,color:'#b0a898',lineHeight:1.8}}>{n.desc}</div>
                </div>
              );
            })()}
            {tosses.length>0&&(
              <div style={{display:'flex',flexDirection:'column-reverse',alignItems:'center',gap:6,margin:'20px 0',padding:'16px',background:'rgba(26,23,20,0.4)',borderRadius:12}}>
                <div style={{fontSize:11,color:'#6a5f52',marginTop:4}}>已成卦象</div>
                {tosses.map((_,i)=>(<HexLine key={i} isYang={tosses[i].value===1} isChanging={tosses[i].changing} animated={true}/>))}
              </div>
            )}
            <div style={{textAlign:'center',marginTop:20}}>
              {!showTossResult?(
                <button className="mBtn" onClick={doToss} disabled={coinAnim==='flying'||coinAnim==='landing'} style={{opacity:(coinAnim!=='idle'&&coinAnim!=='done')?0.4:1}}>掷 铜 钱</button>
              ):(
                <button className="gBtn" onClick={nextToss}>{tossIndex<5?'掷下一爻 →':'查看卦象 →'}</button>
              )}
            </div>
          </div>
        )}

        {phase==='reveal'&&hexData&&(
          <div className="fi" style={{textAlign:'center'}}>
            <div style={{fontFamily:FH,fontSize:18,color:'#e8d48b',margin:'20px 0'}}>六爻已成</div>
            <div style={card}>
              <div style={{display:'flex',flexDirection:'column-reverse',alignItems:'center',gap:10}}>
                {lines.map((v,i)=>(<HexLine key={i} isYang={v===1} isChanging={changingLines[i]} animated={i<revealStep}/>))}
              </div>
              {revealStep>=6&&(
                <div className="fi" style={{marginTop:24}}>
                  <div style={{fontFamily:FH,fontSize:48,fontWeight:900,color:'#c9a84c'}}>{hexData.name}</div>
                  <div style={{fontFamily:FH,fontSize:16,color:'#e8d48b'}}>{hexData.title}</div>
                </div>
              )}
            </div>
          </div>
        )}

        {phase==='reading'&&hexData&&(
          <div className="fi">
            <div style={card}>
              <div style={{display:'flex',gap:24,alignItems:'center'}}>
                <div style={{display:'flex',flexDirection:'column-reverse',gap:6,flexShrink:0}}>
                  {lines.map((v,i)=>(<HexLine key={i} isYang={v===1} isChanging={changingLines[i]} animated={true}/>))}
                </div>
                <div>
                  <div style={{fontFamily:FH,fontSize:36,fontWeight:900,color:'#c9a84c'}}>{hexData.name}</div>
                  <div style={{fontFamily:FH,fontSize:15,color:'#e8d48b'}}>{hexData.title} · 第{hexNum}卦</div>
                  {hasChanging&&changedHexData&&<div style={{fontSize:13,color:'#d45c5c',marginTop:6,fontFamily:FH}}>变卦 → {changedHexData.title}</div>}
                </div>
              </div>
              {question&&<div style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(201,168,76,0.1)',fontSize:14,color:'#8a7f72'}}>所问：<span style={{color:'#b0a898'}}>{question}</span></div>}
            </div>
            <div style={card}>
              <div style={{fontFamily:FH,fontSize:15,color:'#c9a84c',marginBottom:16,letterSpacing:4,display:'flex',alignItems:'center',gap:8}}>
                <span>📜</span> 卦辞
              </div>
              <div style={{fontSize:15,color:'#b0a898',lineHeight:2,marginBottom:20}}>{hexData.gua}</div>
              <div style={{fontFamily:FH,fontSize:15,color:'#c9a84c',marginBottom:12,letterSpacing:4}}>爻辞</div>
              {hexData.yao.map((y,i)=>{
                const yy=lines[i]===1?'九':'六';
                const pos=i===0?`初${yy}`:i===5?`上${yy}`:`${yy}${YAO_NAMES[i]}`;
                return(
                  <div key={i} style={{padding:'10px 14px',borderRadius:8,marginBottom:6,background:changingLines[i]?'rgba(212,92,92,0.08)':'rgba(255,255,255,0.02)',borderLeft:changingLines[i]?'3px solid #d45c5c':'3px solid transparent'}}>
                    <span style={{fontFamily:FH,fontSize:13,color:changingLines[i]?'#d45c5c':'#c9a84c',fontWeight:700,marginRight:8}}>{pos}{changingLines[i]?' 动':''}</span>
                    <span style={{fontSize:13,color:'#9a9080'}}>{y}</span>
                  </div>
                );
              })}
              {changedHexData&&(
                <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(201,168,76,0.1)'}}>
                  <div style={{fontFamily:FH,fontSize:14,color:'#d45c5c',marginBottom:8}}>变卦：{changedHexData.title}</div>
                  <div style={{fontSize:13,color:'#9a9080',lineHeight:1.8}}>{changedHexData.gua}</div>
                </div>
              )}
            </div>
            <div style={{textAlign:'center',marginTop:28}}>
              <button className="gBtn" onClick={reset}>重新起卦</button>
            </div>
          </div>
        )}
        <div style={{textAlign:'center',marginTop:48,fontSize:11,color:'#4a4238',lineHeight:2}}>心诚则灵 · 同一事不可反复占问</div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
